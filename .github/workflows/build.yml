name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MacTrafficLights
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: cmd
        run: Build.bat

      - name: Upload executable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacTrafficLights
          path: MacTrafficLights.exe
          if-no-files-found: error

